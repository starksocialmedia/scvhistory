# The review screens, locally only.
#
# They live at <project>/review, outside the web root, because on Cloudways
# nothing reads web/.htaccess and this application's panel offers no Nginx
# settings, so a path under web/ cannot be reliably blocked. Outside the docroot
# there is nothing to block: the files are unservable wherever the repo lands.
#
# This alias puts them back at https://scvhistory.ddev.site/review/ for the
# person doing the reviewing. It is DDEV configuration, included by the
# generated vhost from /mnt/ddev_config/nginx/*.conf, so it applies to this
# container and to nothing else. Staging never sees it.
#
# After changing this file: ddev exec nginx -s reload
location ^~ /review/ {
    alias /var/www/html/review/;
    autoindex off;
    try_files $uri $uri/ =404;
}
