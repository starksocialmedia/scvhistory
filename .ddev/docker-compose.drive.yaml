# The Reggie archive drive, read-only, and optional.
#
# Docker will not start a container whose bind-mount source is missing, and on
# macOS it cannot create /Volumes/Reggie itself. Mounting the drive's own path
# therefore stopped every container whenever the drive was unplugged, which is
# the normal case for an external drive.
#
# So the parent, /Volumes, is mounted instead. It always exists. The web image
# makes /mnt/reggie a symlink to /mnt/volumes/Reggie/SCVHistory
# (.ddev/web-build/Dockerfile.reggie), which dangles while the drive is out.
# Scripts that need the mirror check through scripts/import/_reggie.php and stop
# with a clear message; nothing else notices. No rename, no edit, either way.
#
# Read-only on purpose. This shows every mounted volume to the web container,
# read-only, including the Time Machine backups; nothing in the project reads
# anything but /mnt/volumes/Reggie.
services:
  web:
    volumes:
      - "/Volumes:/mnt/volumes:ro"
