columnSuffix: null
handle: graveCensus
instructions: 'A transcribed cemetery census, one row per plot, in the order the original gives them. Map # ties the row to the cemetery map. Enter the date columns in pairs: "as printed" is what the source actually says, "parsed" is the ISO date only where it can be read without guessing. Leave parsed empty rather than repairing a damaged reading, and say what is wrong in Note. Precision may be a year (1794), a month (1928-03) or a day (1928-03-13). Comments sheet records whether the original has a separate comments page for that grave.'
name: 'Grave Census'
