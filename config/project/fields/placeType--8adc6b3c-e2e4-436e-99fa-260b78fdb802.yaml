handle: placeType
instructions: 'What kind of place this is, which decides how it is grouped and filtered on the places index. Natural: made by the land, such as a river, canyon or summit. Road: a named road, street or highway. Ranch: a rancho or working ranch. Building: a structure. Park: land set aside and open to the public. Site: somewhere a thing happened or stood, with or without remains. Trail: a route travelled rather than a road. Leave empty if none of them fits.'
